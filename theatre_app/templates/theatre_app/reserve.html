{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Театр Třesk! — Бронирование билетов</title>
    <link rel="stylesheet" href="{% static 'theatre_app/css/reserve.css' %}">
    <style>
        select {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        .perf-details {
            background: #111;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 3px solid var(--accent-color);
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <header>
        <a href="/"><img src="{% static 'theatre_app/images/logo-tresk.png' %}" alt="Logo"
                style="max-height: 50px;"></a>
        <nav>
            <a href="/">Главная</a>
            <a href="/program-page/">Программа</a>
            <a href="/o-nas/">О нас</a>
            <a href="/reserve-page/">Билеты</a>
            <a href="/contacts-page/">Контакты</a>
            <a href="/partners/">Партнеры</a>
        </nav>
    </header>

    <div class="container">
        <div class="box">
            <h2 style="color: var(--accent-color); margin-top:0; text-align:center;">Бронирование билетов</h2>

            <div id="selector-block" class="hidden">
                <label for="perf-selector">Выберите спектакль и дату:</label>
                <select id="perf-selector">
                    <option value="">-- Выберите сеанс --</option>
                </select>
            </div>

            <div id="perf-info-block" class="perf-details hidden">
                <p>🎭 <strong>Спектакль:</strong> <span id="info-title">...</span></p>
                <p>📅 <strong>Дата и время:</strong> <span id="info-date">...</span></p>
                <p>💰 <strong>Цена:</strong> <span id="info-price">...</span> CZK</p>
            </div>

            <form id="reserve-form">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" id="user-name" required placeholder="Кек Кекович">
                </div>
                <div class="form-group">
                    <label>Ваш Email</label>
                    <input type="email" id="user-email" required placeholder="test@example.com">
                </div>
                <div class="form-group">
                    <label>Количество мест</label>
                    <input type="number" id="seats-count" min="1" max="10" value="1" required>
                </div>
                <button type="submit">Подтвердить бронирование</button>
                <div id="status-box" class="status-msg"></div>
            </form>
        </div>
    </div>
    <footer class="reserve-footer">
        © 2026 Театр Tresk!. Все права защищены.
    </footer>

    <script>
        let allPerformances = [];
        let selectedPerfId = null;

        async function initReservation() {
            try {
                const response = await fetch('/api/program/all/');
                allPerformances = await response.json();

                const urlParams = new URLSearchParams(window.location.search);
                const idParam = urlParams.get('id');

                if (idParam) {
                    selectedPerfId = parseInt(idParam);
                    displayPerformanceDetails(selectedPerfId);
                } else {
                    setupSelector();
                }
            } catch (err) {
                console.error("Ошибка инициализации:", err);
            }
        }

        function setupSelector() {
            const selectorBlock = document.getElementById('selector-block');
            const selector = document.getElementById('perf-selector');

            selectorBlock.classList.remove('hidden');

            allPerformances.forEach(perf => {
                const option = document.createElement('option');
                option.value = perf.id;
                option.textContent = `"${perf.play_title}" — ${perf.date_time}`;
                selector.appendChild(option);
            });

            selector.addEventListener('change', (e) => {
                selectedPerfId = parseInt(e.target.value) || null;
                if (selectedPerfId) {
                    displayPerformanceDetails(selectedPerfId);
                } else {
                    document.getElementById('perf-info-block').classList.add('hidden');
                }
            });
        }

        function displayPerformanceDetails(id) {
            const perf = allPerformances.find(p => p.id === id);
            if (perf) {
                document.getElementById('info-title').innerText = perf.play_title;
                document.getElementById('info-date').innerText = perf.date_time;
                document.getElementById('info-price').innerText = perf.price;
                document.getElementById('perf-info-block').classList.remove('hidden');
            }
        }

        document.getElementById('reserve-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusBox = document.getElementById('status-box');
            
            if (!selectedPerfId) {
                statusBox.style.display = 'block';
                statusBox.style.backgroundColor = '#c62828';
                statusBox.style.color = '#fff';
                statusBox.innerText = 'Пожалуйста, выберите спектакль из списка!';
                return;
            }

            // Собираем данные из всех трех инпутов
            const data = {
                name: document.getElementById('user-name').value,
                email: document.getElementById('user-email').value,
                seats: parseInt(document.getElementById('seats-count').value)
            };

            try {
                const response = await fetch(`/api/performance/${selectedPerfId}/reserve/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const resData = await response.json();
                statusBox.style.display = 'block';

                if (response.ok) {
                    statusBox.style.backgroundColor = '#2e7d32';
                    statusBox.style.color = '#fff';
                    statusBox.innerText = `Успешно! ${resData.success || 'Билеты забронированы.'}`;
                    
                    initReservation(); 
                } else {
                    statusBox.style.backgroundColor = '#c62828';
                    statusBox.style.color = '#fff';
                    statusBox.innerText = resData.error || 'Ошибка при бронировании.';
                }
            } catch (err) {
                statusBox.style.display = 'block';
                statusBox.style.backgroundColor = '#c62828';
                statusBox.innerText = 'Ошибка соединения с сервером.';
            }
        });

        initReservation();
    </script>
</body>

</html>
